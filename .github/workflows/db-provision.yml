# 一次性数据库供给（workflow_dispatch 手动触发，用完即止）：
# 1) 用 Neon API 创建 Postgres 项目并取连接串（密码全程 add-mask，不出现在日志）
# 2) 应用 prisma/prod-schema.sql 建表
# 3) 跑 prisma/seed-prod.ts（成就 + 默认难度配置，无账号）
# 4) 把 DATABASE_URL 写入 Vercel 生产环境变量（encrypted）
# 前置：在仓库 Settings → Secrets and variables → Actions 添加 NEON_API_KEY 与 VERCEL_TOKEN。
name: db-provision

on:
  workflow_dispatch:
    inputs:
      region:
        description: Neon region
        required: false
        default: aws-ap-southeast-1

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci

      - name: Create Neon project
        id: neon
        run: |
          resp=$(curl -sS -X POST "https://api.neon.tech/v2/projects" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"project\":{\"name\":\"sliceninja\",\"region_id\":\"${{ github.event.inputs.region }}\",\"pg_version\":16}}")
          uri=$(echo "$resp" | jq -r '.connection_uris[0].connection_uri')
          if [ -z "$uri" ] || [ "$uri" = "null" ]; then
            echo "::error::Neon project creation failed"; echo "$resp"; exit 1
          fi
          # 把密码加入 mask，防止出现在后续步骤日志
          echo "::add-mask::$uri"
          echo "connection_uri=$uri" >> "$GITHUB_OUTPUT"
          echo "endpoint=$(echo "$uri" | sed -E 's|postgresql://[^@]+@([^/]+)/.*|\1|')" >> "$GITHUB_OUTPUT"
          echo "dbname=$(echo "$uri" | sed -E 's|.*/([^?]+)\?.*|\1|')" >> "$GITHUB_OUTPUT"
          echo "project_id=$(echo "$resp" | jq -r '.project.id')" >> "$GITHUB_OUTPUT"

      - name: Apply schema (prisma/prod-schema.sql)
        run: npx prisma db execute --schema prisma/schema.postgres.prisma --url "${{ steps.neon.outputs.connection_uri }}" --file prisma/prod-schema.sql

      - name: Seed (achievements + default config, no accounts)
        run: |
          npx prisma generate --schema prisma/schema.postgres.prisma
          DATABASE_URL="${{ steps.neon.outputs.connection_uri }}" npx tsx prisma/seed-prod.ts

      - name: Write DATABASE_URL to Vercel production env (encrypted)
        run: |
          curl -sS -X POST "https://api.vercel.com/v9/projects/prj_YHFjkn6tPqp7ldlCcmwbAb0mqjgE/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"DATABASE_URL\",\"value\":\"${{ steps.neon.outputs.connection_uri }}\",\"type\":\"encrypted\",\"target\":[\"production\"]}" \
            | jq '{key: .key, type: .type, targets: [.target[]]}'

      - name: Report
        run: |
          echo "Neon project: ${{ steps.neon.outputs.project_id }}"
          echo "DB endpoint: ${{ steps.neon.outputs.endpoint }}"
          echo "DB name: ${{ steps.neon.outputs.dbname }}"
